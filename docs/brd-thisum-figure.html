<!DOCTYPE html><html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;padding:0;background:#fff;}
body{display:inline-block;padding:12px;}
svg.brd{width:1500px;max-width:none;height:auto;font-family:"Barlow","Segoe UI",Arial,sans-serif;}
svg.brd text{fill:#1f2422;}
.b-state{fill:#e6f1ee;stroke:#13584c;stroke-width:1.8;}
.b-event{fill:#ffffff;stroke:#13584c;stroke-width:1.8;}
.b-cond{fill:#ffffff;stroke:#13584c;stroke-width:1.8;}
.b-sig{fill:#e6f1ee;stroke:#7fa79c;stroke-width:1.4;}
.b-blob{fill:rgba(37,177,151,0.07);stroke:#13584c;stroke-width:1.5;stroke-dasharray:2 3;}
.b-id{font-weight:700;font-size:12px;fill:#13584c;}
.b-lbl{font-size:12px;}
.b-blobttl{font-size:11px;font-weight:700;fill:#13584c;}
.b-link{stroke:#13584c;stroke-width:1.7;fill:none;}
.b-guard{font-size:11px;fill:#af1d75;font-style:italic;font-weight:600;}
.b-note{font-size:10.5px;fill:#575a5b;}
</style></head><body>
<svg class="brd" viewBox="0 0 1500 860" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#13584c"/></marker></defs>

  <text x="30" y="26" style="font-size:16px;font-weight:700;fill:#13584c">Business Rules Diagram - Enter Furniture Asset</text>
  <text x="30" y="44" style="font-size:11px;fill:#575a5b">CSI1241 Systems Analysis - Group A. Notation: Business Rules Diagram lecture (states, events, conditions, signals, Harel blob).</text>

  <!-- T1 -->
  <path class="b-sig" d="M30,110 H180 L194,132 L180,154 H30 Z"/>
  <text class="b-id" x="40" y="126">T1</text>
  <text class="b-lbl" x="40" y="142">FMO staff enters</text>
  <text class="b-lbl" x="40" y="155">a new asset</text>

  <!-- blob 1: start + C1 + C2 -->
  <rect class="b-blob" x="240" y="70" width="360" height="180" rx="18"/>
  <text class="b-blobttl" x="254" y="88">Harel blob - entry check</text>
  <circle cx="285" cy="140" r="7" fill="#13584c"/>
  <text class="b-note" x="266" y="168">no asset yet</text>
  <polygon class="b-cond" points="410,92 490,131 410,170 330,131"/>
  <text class="b-id" x="388" y="126">C1</text>
  <text class="b-lbl" x="360" y="140">Details valid</text>
  <text class="b-lbl" x="356" y="153">and room exists?</text>
  <polygon class="b-cond" points="530,92 600,131 530,170 460,131"/>
  <text class="b-id" x="512" y="126">C2</text>
  <text class="b-lbl" x="486" y="140">Barcode already</text>
  <text class="b-lbl" x="500" y="153">recorded?</text>
  <path class="b-link" d="M194,132 H328" marker-end="url(#ar)"/>

  <!-- C1 & !C2 -> E1 -> S1 -> M1 -->
  <path class="b-link" d="M600,131 H660" marker-end="url(#ar)"/>
  <text class="b-guard" x="606" y="122">C1 &amp; !C2</text>
  <rect class="b-event" x="662" y="105" width="120" height="52" rx="4"/>
  <text class="b-id" x="674" y="125">E1</text>
  <text class="b-lbl" x="674" y="141">Record asset</text>
  <path class="b-link" d="M782,131 H850" marker-end="url(#ar)"/>
  <ellipse class="b-state" cx="930" cy="131" rx="78" ry="38"/>
  <text class="b-id" x="912" y="127">S1</text>
  <text class="b-lbl" x="908" y="143">Active</text>
  <path class="b-link" d="M1008,121 H1075" marker-end="url(#ar)"/>
  <path class="b-sig" d="M1079,101 H1210 L1224,121 L1210,141 H1079 Z"/>
  <text class="b-id" x="1089" y="117">M1</text>
  <text class="b-lbl" x="1089" y="133">Asset saved</text>

  <!-- !C1 -> E2 -> M2 -->
  <path class="b-link" d="M410,170 V300 H480" marker-end="url(#ar)"/>
  <text class="b-guard" x="360" y="250">!C1</text>
  <rect class="b-event" x="482" y="274" width="120" height="52" rx="4"/>
  <text class="b-id" x="494" y="294">E2</text>
  <text class="b-lbl" x="494" y="310">Reject asset</text>
  <path class="b-link" d="M602,300 H670" marker-end="url(#ar)"/>
  <path class="b-sig" d="M674,280 H806 L820,300 L806,320 H674 Z"/>
  <text class="b-id" x="684" y="296">M2</text>
  <text class="b-lbl" x="684" y="312">Invalid details</text>

  <!-- C1 & C2 -> E3 -> M3 -->
  <path class="b-link" d="M530,170 V390 H700" marker-end="url(#ar)"/>
  <text class="b-guard" x="540" y="330">C1 &amp; C2</text>
  <rect class="b-event" x="702" y="364" width="120" height="52" rx="4"/>
  <text class="b-id" x="714" y="384">E3</text>
  <text class="b-lbl" x="714" y="400">Reject duplicate</text>
  <path class="b-link" d="M822,390 H890" marker-end="url(#ar)"/>
  <path class="b-sig" d="M894,370 H1046 L1060,390 L1046,410 H894 Z"/>
  <text class="b-id" x="904" y="386">M3</text>
  <text class="b-lbl" x="904" y="402">Barcode already used</text>

  <!-- Print label extension: T2 -> blob2{S1} -> E4 -> S1 -> M4 -->
  <rect class="b-blob" x="700" y="470" width="320" height="150" rx="18"/>
  <text class="b-blobttl" x="714" y="488">Harel blob - print label check</text>
  <ellipse class="b-state" cx="820" cy="545" rx="78" ry="36"/>
  <text class="b-id" x="802" y="541">S1</text>
  <text class="b-lbl" x="798" y="557">Active</text>

  <path class="b-sig" d="M430,520 H590 L604,540 L590,560 H430 Z"/>
  <text class="b-id" x="440" y="536">T2</text>
  <text class="b-lbl" x="440" y="552">FMO staff prints label</text>
  <path class="b-link" d="M604,540 H738" marker-end="url(#ar)"/>

  <path class="b-link" d="M898,545 H1080" marker-end="url(#ar)"/>
  <text class="b-guard" x="920" y="536">(state = Active)</text>
  <rect class="b-event" x="1082" y="519" width="120" height="52" rx="4"/>
  <text class="b-id" x="1094" y="539">E4</text>
  <text class="b-lbl" x="1094" y="555">Print label</text>
  <path class="b-link" d="M1202,545 H1250" marker-end="url(#ar)"/>
  <ellipse class="b-state" cx="1320" cy="545" rx="72" ry="34"/>
  <text class="b-id" x="1302" y="541">S1</text>
  <text class="b-lbl" x="1298" y="557">Active</text>
  <text class="b-note" x="1276" y="592">(no state change)</text>

  <!-- Legend -->
  <rect x="30" y="660" width="1120" height="180" rx="8" fill="#f7fbf9" stroke="#d7ddda"/>
  <text class="b-blobttl" x="46" y="682" style="font-size:12px">Legend</text>
  <ellipse class="b-state" cx="100" cy="720" rx="52" ry="22"/><text class="b-id" x="84" y="718">Sn</text><text class="b-lbl" x="78" y="732">state</text>
  <text class="b-note" x="180" y="724">State - a value of the furniture asset status attribute.</text>
  <rect class="b-event" x="50" y="756" width="100" height="34" rx="4"/><text class="b-id" x="62" y="774">En</text><text class="b-lbl" x="62" y="788">event</text>
  <text class="b-note" x="180" y="777">Event - an instantaneous action carried out by the organisation.</text>
  <polygon class="b-cond" points="100,806 150,828 100,834 50,828"/>
  <text class="b-note" x="180" y="820">Condition (diamond, shown in the Harel blob) - a data test that routes a transition.</text>
  <path class="b-sig" d="M640,708 H730 L744,724 L730,740 H640 Z"/><text class="b-id" x="650" y="726">T/M</text>
  <text class="b-note" x="770" y="726">Signal - a trigger (Tn) enters the system; a message (Mn) leaves it.</text>
  <rect class="b-blob" x="640" y="756" width="100" height="34" rx="14"/>
  <text class="b-note" x="770" y="777">Harel blob - encloses the prior state and the condition(s) for a transition.</text>
</svg>
</body></html>
