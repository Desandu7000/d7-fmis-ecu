<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - FMIS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <a class="brand" href="index.html">
      <span class="mark">ECU</span>
      <span class="brand-text">
        FMIS
        <small>Facilities Management Information System</small>
      </span>
    </a>

    <h1 style="font-size:1.15rem;margin-top:18px;">Staff log in</h1>
    <p style="color:var(--ink-soft);font-size:0.9rem;">
      Sign in with your ECU staff account.
    </p>

    <form action="dashboard.html" method="get" data-demo-skip>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="jclause" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" value="demo-password" autocomplete="current-password">
      </div>
      <div class="btn-row">
        <button type="submit" class="btn">Sign in</button>
        <a class="btn secondary" href="index.html">Cancel</a>
      </div>
    </form>

    <div class="note" style="margin-top:20px;">
      This is a demo log in for the assignment. Any details are accepted and no
      account is created. Select Sign in to open the staff dashboard.
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
